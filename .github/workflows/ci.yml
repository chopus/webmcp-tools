# CI covers the server only: the extension has no unit tests (it is
# syntax-checked locally) and e2e needs a real Chrome with the extension
# loaded, which a GitHub-hosted runner cannot provide.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run build
      - run: npm test
