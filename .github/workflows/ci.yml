# CI covers the server only: the extension has no unit tests (it is
# syntax-checked locally) and e2e needs a real Chrome with the extension
# loaded, which a GitHub-hosted runner cannot provide.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    # Pinned: ubuntu-latest flips to Ubuntu 26 on 2026-10-19; re-pin
    # deliberately rather than riding the migration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run build
      - run: npm test
